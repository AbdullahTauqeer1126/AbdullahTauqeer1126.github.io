version: '3.8'

services:
  # ═══════════ Backend API ═══════════
  api:
    build:
      context: ./trucking-api
      dockerfile: Dockerfile
    container_name: truckapp-api
    ports:
      - "3001:3001"
    env_file:
      - ./trucking-api/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=http://localhost:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - truckapp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════ Frontend Web ═══════════
  web:
    build:
      context: ./trucking-web
      dockerfile: Dockerfile
    container_name: truckapp-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:3001
    depends_on:
      api:
        condition: service_healthy
    networks:
      - truckapp
    restart: unless-stopped

  # ═══════════ Redis (OTP/Session Cache) ═══════════
  redis:
    image: redis:7-alpine
    container_name: truckapp-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - truckapp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ═══════════ Nginx Reverse Proxy ═══════════
  nginx:
    image: nginx:alpine
    container_name: truckapp-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - truckapp
    restart: unless-stopped

volumes:
  redis-data:

networks:
  truckapp:
    driver: bridge
