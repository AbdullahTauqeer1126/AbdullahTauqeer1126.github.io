version: '3.8'

services:
  # ========== POSTGRES DATABASE ==========
  postgres:
    image: postgres:16-alpine
    container_name: trucking_postgres
    environment:
      POSTGRES_USER: trucking_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
      POSTGRES_DB: trucking_db
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=postgis"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./trucking-api/supabase-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./trucking-api/migrations:/docker-entrypoint-initdb.d/migrations
    networks:
      - trucking_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trucking_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== REDIS CACHE ==========
  redis:
    image: redis:7-alpine
    container_name: trucking_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trucking_network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== BACKEND API ==========
  api:
    build:
      context: ./trucking-api
      dockerfile: Dockerfile
    container_name: trucking_api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://trucking_user:${DB_PASSWORD:-secure_password_123}@postgres:5432/trucking_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_jwt_refresh_secret_key}
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      BREVO_API_KEY: ${BREVO_API_KEY}
      JAZZCASH_MERCHANT_ID: ${JAZZCASH_MERCHANT_ID}
      JAZZCASH_PASSWORD: ${JAZZCASH_PASSWORD}
      JAZZCASH_URL: ${JAZZCASH_URL}
      EASYPAISA_STORE_ID: ${EASYPAISA_STORE_ID}
      EASYPAISA_AUTH_TOKEN: ${EASYPAISA_AUTH_TOKEN}
      EASYPAISA_URL: ${EASYPAISA_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      API_URL: http://api:3001
      APP_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trucking_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ========== FRONTEND WEB ==========
  web:
    build:
      context: ./trucking-web
      dockerfile: Dockerfile
    container_name: trucking_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - trucking_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ========== NGINX REVERSE PROXY ==========
  nginx:
    image: nginx:latest
    container_name: trucking_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      - trucking_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  trucking_network:
    driver: bridge
