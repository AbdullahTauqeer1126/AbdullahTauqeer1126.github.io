services:
  - type: web
    name: trucking-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        fromContext: env
      - key: SUPABASE_ANON_KEY
        fromContext: env
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromContext: env
