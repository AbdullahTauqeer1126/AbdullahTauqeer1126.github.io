name: TruckApp CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ═══════════ Lint & Type Check ═══════════
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [trucking-api, trucking-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: cd ${{ matrix.project }} && npm ci
      - run: cd ${{ matrix.project }} && npx tsc --noEmit || true

  # ═══════════ API Unit Tests ═══════════
  test-api:
    name: API Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: trucking-api/package-lock.json
      - run: cd trucking-api && npm ci
      - run: cd trucking-api && npm test -- --coverage --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: trucking-api/coverage/

  # ═══════════ Build Docker Images ═══════════
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-api]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t truckapp-api:${{ github.sha }} ./trucking-api
      - name: Build Web image
        run: docker build -t truckapp-web:${{ github.sha }} ./trucking-web

  # ═══════════ Deploy ═══════════
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/truckapp
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker compose ps
