name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========== LINT & TYPE CHECK ==========
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (API)
        working-directory: ./trucking-api
        run: npm ci

      - name: Lint (API)
        working-directory: ./trucking-api
        run: npm run lint || true

      - name: Install dependencies (Web)
        working-directory: ./trucking-web
        run: npm ci

      - name: Lint (Web)
        working-directory: ./trucking-web
        run: npm run lint || true

      - name: Type check (API)
        working-directory: ./trucking-api
        run: npm run build || true

      - name: Type check (Web)
        working-directory: ./trucking-web
        run: npm run build || true

  # ========== TESTS ==========
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trucking_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: trucking_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (API)
        working-directory: ./trucking-api
        run: npm ci

      - name: Run tests (API)
        working-directory: ./trucking-api
        env:
          DATABASE_URL: postgresql://trucking_user:test_password@localhost:5432/trucking_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret
        run: npm test -- --coverage --forceExit

      - name: Upload coverage (API)
        uses: codecov/codecov-action@v3
        with:
          files: ./trucking-api/coverage/coverage-final.json
          flags: backend

      - name: Install dependencies (Web)
        working-directory: ./trucking-web
        run: npm ci

      - name: Run tests (Web)
        working-directory: ./trucking-web
        run: npm test -- --coverage --forceExit || true

      - name: Upload coverage (Web)
        uses: codecov/codecov-action@v3
        with:
          files: ./trucking-web/coverage/coverage-final.json
          flags: frontend

  # ========== E2E TESTS ==========
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trucking_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: trucking_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies (API)
        working-directory: ./trucking-api
        run: npm ci

      - name: Build (API)
        working-directory: ./trucking-api
        run: npm run build

      - name: Start API
        working-directory: ./trucking-api
        env:
          DATABASE_URL: postgresql://trucking_user:test_password@localhost:5432/trucking_db
          JWT_SECRET: test_secret
        run: npm start &

      - name: Wait for API
        run: npx wait-on http://localhost:3001

      - name: Install dependencies (Web)
        working-directory: ./trucking-web
        run: npm ci

      - name: Install Playwright
        working-directory: ./trucking-web
        run: npx playwright install --with-deps

      - name: Run E2E tests
        working-directory: ./trucking-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: npm run test:e2e || true

  # ========== BUILD DOCKER IMAGES ==========
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (API)
        id: meta_api
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push (API)
        uses: docker/build-push-action@v4
        with:
          context: ./trucking-api
          file: ./trucking-api/Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}

      - name: Extract metadata (Web)
        id: meta_web
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push (Web)
        uses: docker/build-push-action@v4
        with:
          context: ./trucking-web
          file: ./trucking-web/Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}

  # ========== SECURITY SCAN ==========
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner (API)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './trucking-api'
          format: 'sarif'
          output: 'trivy-api.sarif'

      - name: Upload Trivy results (API)
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-api.sarif'
          category: 'trivy-api'

      - name: Run Trivy vulnerability scanner (Web)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './trucking-web'
          format: 'sarif'
          output: 'trivy-web.sarif'

      - name: Upload Trivy results (Web)
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-web.sarif'
          category: 'trivy-web'

  # ========== DEPLOY TO STAGING ==========
  deploy-staging:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [build, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to staging
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST 'cd /app && docker-compose -f docker-compose.prod.yml pull && docker-compose -f docker-compose.prod.yml up -d'

      - name: Run smoke tests
        run: |
          curl -f http://staging.raftaarfreight.pk/api/health || exit 1

  # ========== DEPLOY TO PRODUCTION ==========
  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, security]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST 'cd /app && docker-compose -f docker-compose.prod.yml pull && docker-compose -f docker-compose.prod.yml up -d'

      - name: Run smoke tests
        run: |
          curl -f https://raftaarfreight.pk/api/health || exit 1

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
